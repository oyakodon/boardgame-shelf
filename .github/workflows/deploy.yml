name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    # workflow_run は CI が pull_request でも動くため、branches: [main] だけでは
    # フォークで main という名前のブランチからPRを作られた場合にも発火しうる。
    # push トリガー由来かつ本リポジトリのコミットであることまで確認する。
    # workflow_dispatch もmainブランチからの手動実行のみに限定する。
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # wrangler.jsonc は秘密情報を含まないが git 管理はせず、リポジトリ変数(vars)から
      # CI実行のたびに wrangler.jsonc.example のプレースホルダーを置き換えて生成する。
      # ローカル開発では scripts/ensure-wrangler-config.mjs で各自が同じテンプレートから作る。
      - name: Generate wrangler.jsonc from repository variables
        run: |
          sed \
            -e "s|REPLACE_WITH_D1_DATABASE_ID|${{ vars.CF_D1_DATABASE_ID }}|" \
            -e "s|REPLACE_WITH_DISCORD_CLIENT_ID|${{ vars.DISCORD_CLIENT_ID }}|" \
            -e "s|REPLACE_WITH_DISCORD_GUILD_ID|${{ vars.DISCORD_GUILD_ID }}|" \
            -e "s|REPLACE_WITH_COMMA_SEPARATED_DISCORD_USER_IDS|${{ vars.ADMIN_DISCORD_IDS }}|" \
            wrangler.jsonc.example > wrangler.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply boardgame-shelf --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
